# .github/workflows/scraper.yml
# Daily: scrape -> commit bikes.json -> match watchlist -> upload email drafts
# -> trigger the site's "Refresh auction data" workflow (chained, not clock-timed).
name: Daily auction scrape

on:
  schedule:
    # 09:00 UTC = 5am US Eastern (EDT) / 4am (EST) = ~18:00-19:00 JST. Runs near
    # the end of Japan's business day so the scrape captures listings BDS posts
    # or updates throughout the day, not just the morning. (Japan is UTC+9, i.e.
    # 13-14h ahead of US Eastern depending on daylight saving.)
    - cron: "0 9 * * *"
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python koscom_scraper_v3.py

      - name: Match watchlist & draft outreach (no media in CI)
        run: python watchlist_outreach.py --no-media
        continue-on-error: true   # don't fail the data update if watchlist.json absent

      - name: Commit updated data
        run: |
          git config user.name "moto2-bot"
          git config user.email "actions@github.com"
          git add bikes.json
          git add notified.json 2>/dev/null || true
          git add outreach/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Daily auction data $(date -u +%F)"
          git push

      - name: Trigger site refresh (moto2-site)
        # Chain the site's "Refresh auction data" run to *this scrape finishing*,
        # instead of relying on a fixed time gap between two independent
        # schedules (which breaks whenever the scrape runs long or Actions is
        # degraded). Only fires when the steps above succeeded. The site keeps a
        # daily scheduled run as a fallback, so a dispatch hiccup here is
        # non-fatal — hence continue-on-error.
        if: success()
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN not set — skipping site dispatch."
            echo "The site's scheduled fallback run will still refresh the data."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/moto2imports/moto2-site/dispatches \
            -d '{"event_type":"scraper-finished"}')
          if [ "$status" = "204" ]; then
            echo "Site refresh triggered (repository_dispatch: scraper-finished)."
          else
            echo "Dispatch failed with HTTP $status:"
            cat /tmp/dispatch.json || true
            exit 1
          fi

      - name: Upload email drafts as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outreach-drafts
          path: outreach/
          if-no-files-found: ignore
